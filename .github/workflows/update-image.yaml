name: Auto-update Helm image

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/bin/yq

      - name: Detect latest image
        id: image
        run: |
          CURRENT=$(yq '.appVersion' mongo-compass/Chart.yaml)
          LATEST=$(curl -s 'https://hub.docker.com/v2/repositories/haohanyang/compass-web/tags?page_size=50' \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -1)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "No update needed: $CURRENT"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Update available: $CURRENT -> $LATEST"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Update chart
        if: steps.image.outputs.skip == 'false'
        run: |
          chmod +x scripts/update-chart.sh
          cd mongo-compass
          ../scripts/update-chart.sh "${{ steps.image.outputs.latest }}"

      - name: Validate Helm
        if: steps.image.outputs.skip == 'false'
        run: |
          helm lint mongo-compass
          helm template mongo-compass mongo-compass

      - name: Check existing PR
        if: steps.image.outputs.skip == 'false'
        id: pr_check
        run: |
          EXISTING=$(gh pr list --search "update compass-web image to ${{ steps.image.outputs.latest }}" --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #$EXISTING"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Pull Request
        if: steps.image.outputs.skip == 'false' && steps.pr_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/update-image-${{ steps.image.outputs.latest }}"
          git checkout -b "$BRANCH"
          git add mongo-compass/Chart.yaml mongo-compass/values.yaml
          git commit -m "chore: update compass-web image to ${{ steps.image.outputs.latest }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: update compass-web image to ${{ steps.image.outputs.latest }}" \
            --body "Automated Helm chart update from Docker Hub upstream \`haohanyang/compass-web:${{ steps.image.outputs.latest }}\`" \
            --label "automated" \
            --label "helm"
        env:
          GH_TOKEN: ${{ github.token }}
